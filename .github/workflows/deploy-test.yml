# RWQAN TEST — Firebase App Hosting automatic rollout for the TEST backend.
#
# Purpose: a manual workflow_dispatch on either the OLD (main) or NEW
# (test/unified-gateway-ui-only) branch creates a rollout on the TEST backend
# (rwqan-backend @ europe-west4, project rwqan-757) using the exact commit SHA
# of the dispatched branch.
#
# Production safety (hard requirements, do not relax):
#   - This workflow MUST ONLY ever run on branches main (OLD) or
#     test/unified-gateway-ui-only (NEW). The `if:` guard enforces this even for
#     workflow_dispatch, so a manual run can never target another branch.
#   - The `source` input MUST match the dispatched branch: OLD→main,
#     NEW→test/unified-gateway-ui-only. A mismatch aborts before any deploy.
#   - LIVE stays on main / backend `rwqan` / firebase.json / apphosting.yaml —
#     none of those are touched by this file.
#
# Authentication — Workload Identity Federation ONLY (no FIREBASE_TOKEN, no
# admin OAuth, no service account key, ever):
#   Repository secrets:
#     WIF_PROVIDER        projects/<proj-no>/locations/global/workloadIdentityPools/<pool>/providers/<provider>
#     WIF_SERVICE_ACCOUNT <sa-name>@<project>.iam.gserviceaccount.com
#   IMPORTANT: The WIF provider's attribute condition must admit BOTH
#     refs/heads/main AND refs/heads/test/unified-gateway-ui-only on repository
#     "modii1/rwqan". If WIF is restricted to only test/unified-gateway-ui-only,
#     dispatching on main (source=OLD) will fail with 403. This requires a
#     manual WIF provider update — see the implementation report.
#   The service account gets roles/firebaseapphosting.developer scoped to the
#   TEST backend only (see setup instructions).
#   firebase-tools resolves credentials from GOOGLE_APPLICATION_CREDENTIALS
#   (exported by google-github-actions/auth). NOTE: use firebase-tools >=
#   15.22.3 — older 15.x silently swallowed the real auth error in CI
#   (firebase-tools issue #10726 / Node CVE-2026-48931 regression).
# Secrets are never echoed; secret values are never expanded into run scripts
# (only into `env` blocks via expressions, which are masked).
#
# No build, test, or lint steps: this workflow deploys directly.

name: Deploy TEST Rollout

on:
  workflow_dispatch:
    inputs:
      source:
        description: "مصدر النشر إلى TEST: OLD (القديم) أو NEW (الجديد)"
        required: true
        type: choice
        options:
          - OLD
          - NEW
      expected_sha:
        description: "Full 40-hex commit SHA approved by the admin (must equal the dispatched tip)"
        required: true
        type: string

permissions:
  contents: read
  id-token: write # required only for the Workload Identity Federation path

concurrency:
  group: deploy-test
  cancel-in-progress: false # never cancel an in-flight rollout creation

jobs:
  deploy-test:
    name: App Hosting TEST rollout
    runs-on: ubuntu-latest
    # Hard guard: only main (OLD) and test/unified-gateway-ui-only (NEW) may run.
    # Any other branch (including any LIVE-related ref) aborts immediately.
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/test/unified-gateway-ui-only'

    steps:
      - name: Check WIF configuration
        id: auth
        env:
          HAS_WIF_PROVIDER: ${{ secrets.WIF_PROVIDER != '' }}
          HAS_WIF_SA: ${{ secrets.WIF_SERVICE_ACCOUNT != '' }}
        run: |
          if [ "$HAS_WIF_PROVIDER" = "true" ] && [ "$HAS_WIF_SA" = "true" ]; then
            echo "mode=wif" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Workload Identity Federation is not configured. Add WIF_PROVIDER and WIF_SERVICE_ACCOUNT to repository secrets (see workflow file header for the exact setup)."
            exit 1
          fi

      - name: Validate source/branch/SHA match
        id: validate
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ "${{ inputs.source }}" != "OLD" ]; then
            echo "::error::المصدر OLD يتطلب الفرع main، لكن عمليات الإرسال جرت على الفرع ${{ github.ref }}"
            exit 1
          fi
          if [ "${{ github.ref }}" = "refs/heads/test/unified-gateway-ui-only" ] && [ "${{ inputs.source }}" != "NEW" ]; then
            echo "::error::المصدر NEW يتطلب الفرع test/unified-gateway-ui-only، لكن عمليات الإرسال جرت على الفرع ${{ github.ref }}"
            exit 1
          fi
          if ! echo "${{ inputs.expected_sha }}" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::expected_sha يجب أن يكون SHA كاملًا (40 خانة سداسية)."
            exit 1
          fi
          # OLD is pinned to the approved APPLICATION commit. The dispatched
          # commit (github.sha) may be NEWER because it also contains this
          # workflow file; that is expected and is verified by ancestry below.
          if [ "${{ inputs.source }}" = "OLD" ] && [ "${{ inputs.expected_sha }}" != "15c60767c49b812f6f35e8c29245651cbd4fe3dd" ]; then
            echo "::error::OLD expected_sha يجب أن يساوي SHA التطبيق المعتمد 15c60767c49b812f6f35e8c29245651cbd4fe3dd."
            exit 1
          fi
          echo "source_valid=true" >> "$GITHUB_OUTPUT"
          echo "=== Publishing ${{ inputs.source }} from ${{ github.ref }} at ${{ inputs.expected_sha }} ==="

      # Check out the DISPATCHED branch with full history so the ancestry of
      # the approved application SHA can be proven. This is NOT the build
      # source; the next checkout is.
      - name: Check out dispatched branch for verification
        if: steps.validate.outputs.source_valid == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Verify approved application SHA belongs to the dispatched branch
        if: steps.validate.outputs.source_valid == 'true'
        run: |
          set -euo pipefail
          if ! git cat-file -e "${{ inputs.expected_sha }}^{commit}" 2>/dev/null; then
            echo "::error::expected_sha غير موجود في المستودع: ${{ inputs.expected_sha }}"
            exit 1
          fi
          if ! git merge-base --is-ancestor "${{ inputs.expected_sha }}" "${{ github.sha }}"; then
            echo "::error::SHA التطبيق المعتمد ${{ inputs.expected_sha }} ليس ضمن تاريخ الفرع ${{ github.ref }} (github.sha=${{ github.sha }}) — لن يُنشر commit غير معتمد."
            exit 1
          fi
          echo "=== Verified ${{ inputs.expected_sha }} is part of ${{ github.ref }} (dispatch commit ${{ github.sha }}) ==="

      # The BUILD source is exactly the approved application SHA — never the
      # branch tip and never github.sha.
      - name: Check out exact approved application SHA
        if: steps.validate.outputs.source_valid == 'true'
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1

      - name: Authenticate to Google Cloud (Workload Identity Federation)
        if: steps.auth.outputs.mode == 'wif'
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}
          # auth@docs: project_id must be given explicitly — it cannot be
          # derived from a provider path (which carries the project NUMBER).
          project_id: rwqan-757

      - name: Install Firebase CLI
        if: steps.auth.outputs.mode == 'wif'
        # Pinned: >= 15.22.3 carries the fix for issue #10726 where older 15.x
        # replaced the real ADC/STS error with a misleading
        # "Failed to authenticate, have you run firebase login?" in CI.
        run: |
          npm install --global firebase-tools@15.22.3
          firebase --version

      - name: Diagnose WIF identity and project access (temporary, no secrets)
        if: steps.auth.outputs.mode == 'wif'
        run: |
          echo "=== Active identity ==="
          gcloud auth list --filter=status:ACTIVE --format="value(account)"
          echo "=== Project ID ==="
          gcloud config get-value project
          echo "=== Project number ==="
          gcloud projects describe $(gcloud config get-value project) --format="value(projectNumber)"
          echo "=== Firebase App Hosting API status ==="
          gcloud services list --filter="name:firebaseapphosting.googleapis.com" --format="value(name,state)" || true
          echo "=== Service Usage roles ==="
          gcloud projects get-iam-policy $(gcloud config get-value project) \
            --filter="bindings.role:roles/serviceusage.serviceUsageConsumer OR bindings.role:roles/serviceusage.serviceUsageAdmin" \
            --format="value(bindings.role,bindings.members[])" || true

      - name: Create App Hosting TEST rollout
        if: steps.auth.outputs.mode == 'wif'
        # The renderer substitutes the exact SHA of the commit that triggered
        # this run — never a local archive without commit identity. Credentials
        # come from GOOGLE_APPLICATION_CREDENTIALS exported by the auth step.
        # NOTE: firebase-tools >= 15.22.3 does NOT support --location on
        # apphosting:rollouts:create; the region is fixed on the backend
        # (rwqan-backend @ europe-west4) in Firebase Console. -P and -c are
        # global firebase CLI options (project + config file).
        run: |
          firebase -P rwqan-757 -c firebase.dev.json apphosting:rollouts:create rwqan-backend \
            --git-commit ${{ inputs.expected_sha }} \
            --force
