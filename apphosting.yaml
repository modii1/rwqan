# Settings for Backend (on Cloud Run).
# See https://firebase.google.com/docs/app-hosting/configure#cloud-run
runConfig:
  minInstances: 0
  maxInstances: 100
  concurrency: 80
  cpu: 2
  memoryMiB: 2048

# Environment variables and secrets.
env:
  - variable: NEXTJS_ADAPTER_VERSION
    value: "latest"
    availability:
      - BUILD
